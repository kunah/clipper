[project]
name = "clipper-detector"
version = "0.1.0"
description = "Finds candidate moments: chat spikes scored against the channel's own baseline, fake-spike filter, emote lexicon."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "clipper-twitch",
]

[project.scripts]
clipper-detector = "clipper_detector.main:main"

[tool.uv.sources]
clipper-core = { workspace = true }
clipper-twitch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_detector"]
# The root .gitignore ignores data/ directories; hatch would leave the lexicon out of the wheel.
artifacts = ["src/clipper_detector/data/*.toml"]
