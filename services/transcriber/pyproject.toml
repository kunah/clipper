[project]
name = "clipper-transcriber"
version = "0.1.0"
description = "Transcribes audio chunks: voice-activity-gated speech recognition, sentences, per-second audio metrics."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "numpy>=2.1",
    "onnxruntime==1.31.1",
]

[tool.uv.sources]
clipper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_transcriber"]
