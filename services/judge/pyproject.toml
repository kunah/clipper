[project]
name = "clipper-judge"
version = "0.1.0"
description = "Judges candidate moments with an LLM and resolves its answer into a validated edit plan (DESIGN §19)."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
]

[project.scripts]
clipper-judge = "clipper_judge.main:main"

[tool.uv.sources]
clipper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_judge"]
