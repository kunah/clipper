[project]
name = "clipper-controller"
version = "0.1.0"
description = "Which channels are live (Helix), streams + viewer counts, maintenance. Also `clipper-channels`."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "clipper-twitch",
]

[project.scripts]
clipper-controller = "clipper_controller.main:main"
clipper-channels = "clipper_controller.channels_cli:main"

[tool.uv.sources]
clipper-core = { workspace = true }
clipper-twitch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_controller"]
