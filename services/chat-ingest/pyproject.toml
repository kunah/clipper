[project]
name = "clipper-chat-ingest"
version = "0.1.0"
description = "Logs Twitch chat: raw messages, events (subs/raids/...), per-second stats incl. emotes."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "clipper-twitch",
]

[project.scripts]
clipper-chat-ingest = "clipper_chat_ingest.main:main"

[tool.uv.sources]
clipper-core = { workspace = true }
clipper-twitch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_chat_ingest"]
