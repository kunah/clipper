[project]
name = "clipper-recorder"
version = "0.1.0"
description = "Records live streams: HLS segments -> ~60 s .ts video + .aac audio chunks, gaps, transcription jobs."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "clipper-twitch",
    "httpx>=0.27",
    "streamlink>=7.0",
]

[project.scripts]
clipper-recorder = "clipper_recorder.main:main"

[tool.uv.sources]
clipper-core = { workspace = true }
clipper-twitch = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_recorder"]
