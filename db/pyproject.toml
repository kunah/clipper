[project]
name = "clipper-db"
version = "0.1.0"
description = "Schema migrations + one-off init (partitions, bucket). Runs as the `migrate` container."
requires-python = ">=3.12"
dependencies = [
    "clipper-core",
    "alembic>=1.14",
]

[project.scripts]
clipper-migrate = "clipper_db.cli:main"

[tool.uv.sources]
clipper-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clipper_db"]
