# Clipper stack. Every service is its own app + image (see services/*/Dockerfile).
# Infra ports are bound to 127.0.0.1 only, so nothing is exposed to the network.
#
#   docker compose up -d            # postgres + object storage + migrate + CPU services
#   docker compose up -d transcriber   # the GPU worker (profile `gpu`; naming it enables it)
#   docker compose up -d detector      # live detector (profile `detector`)
#   docker compose up -d judge         # judge (profile `judge`; CLIPPER_JUDGE_MODEL, fake by default)
#   docker compose run --rm backfill vod <id> --dry-run   # one-off tool (profile `tools`)
#   docker compose logs -f migrate
#
# Data lives in named volumes inside Docker's disk image (on E: on this PC).
# To put object storage somewhere else, set OBJECTSTORE_DATA to a host path in .env.

name: clipper

x-app-env: &app-env
  CLIPPER_DATABASE_URL: postgresql+psycopg://clipper:${POSTGRES_PASSWORD:-clipper}@postgres:5432/clipper
  CLIPPER_S3_ENDPOINT: http://objectstore:8333
  CLIPPER_S3_ACCESS_KEY: ${S3_ACCESS_KEY:-clipper}
  CLIPPER_S3_SECRET_KEY: ${S3_SECRET_KEY:-clipper-dev-secret}
  CLIPPER_S3_BUCKET: clipper
  CLIPPER_LOG_LEVEL: ${CLIPPER_LOG_LEVEL:-INFO}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clipper}
      POSTGRES_DB: clipper
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=1GB"]
    volumes:
      - pgdata:/var/lib/postgresql   # pg18 images keep data under /var/lib/postgresql/18
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"   # 5433: another project uses 5432 on this PC
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipper -d clipper"]
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible storage (SeaweedFS `weed mini`: all-in-one, the image's default command).
  # MinIO stopped publishing community images in Oct 2025, so we don't use it.
  objectstore:
    image: chrislusf/seaweedfs:4.53
    restart: unless-stopped
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-clipper}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-clipper-dev-secret}
    volumes:
      - ${OBJECTSTORE_DATA:-objectdata}:/data
    ports:
      - "127.0.0.1:8333:8333"   # S3 API

  # One-off: migrations + chat partitions + bucket. Services wait for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: db/Dockerfile
    image: clipper/migrate:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: migrate
    depends_on:
      postgres:
        condition: service_healthy
      objectstore:
        condition: service_started
    restart: "no"

  # Which channels are live + viewer counts (needs Twitch app credentials), maintenance.
  controller:
    build:
      context: .
      dockerfile: services/controller/Dockerfile
    image: clipper/controller:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: controller
      CLIPPER_TWITCH_CLIENT_ID: ${CLIPPER_TWITCH_CLIENT_ID:-}
      CLIPPER_TWITCH_CLIENT_SECRET: ${CLIPPER_TWITCH_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Chat logger. Restarting it loses the chat in between, so redeploy it rarely.
  chat-ingest:
    build:
      context: .
      dockerfile: services/chat-ingest/Dockerfile
    image: clipper/chat-ingest:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: chat-ingest
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 20s   # time to flush buffered chat on shutdown

  # Records live streams into ~60 s chunks (video .ts + audio .aac) and queues transcription.
  # Restarting loses the stream in between (recorded as a gap), so redeploy it rarely.
  recorder:
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    image: clipper/recorder:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: recorder
      CLIPPER_WORKER_ID: recorder-1   # stable id: a restart takes its channel leases right back
      CLIPPER_RECORDER_QUALITIES: ${CLIPPER_RECORDER_QUALITIES:-best}
    volumes:
      - spool:/spool   # chunks not uploaded yet survive restarts
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s   # close open chunks and upload them

  # GPU worker: transcribes chunks (faster-whisper large-v3-turbo and CED sound classes, ONNX on
  # onnxruntime-gpu, both on CUDA; Silero VAD and CED baked into the image). Whisper's weights
  # (~1.5 GB) are downloaded into the `models` volume on first start. One per GPU; SIGTERM
  # finishes the job in progress.
  # Profile `gpu`: a bare `docker compose up -d` leaves it out; start it by name (see the header).
  transcriber:
    profiles: [gpu]
    build:
      context: .
      dockerfile: services/transcriber/Dockerfile
    image: clipper/transcriber:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: transcriber
      CLIPPER_WORKER_ID: transcriber-1   # stable id: one heartbeat row across restarts
    volumes:
      - models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s

  # Live detector (DESIGN §18): chat spikes -> candidates + media requests (+ judge jobs once
  # CLIPPER_DETECTOR_JUDGE_JOBS=1, i.e. when the judge exists). Needs migration 0004.
  # Profile `detector`: a bare `docker compose up -d` leaves it out; start it by name.
  # Viewer clips (Helix Get Clips) are polled only with Twitch credentials.
  detector:
    profiles: [detector]
    build:
      context: .
      dockerfile: services/detector/Dockerfile
    image: clipper/detector:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: detector
      # Stable id: a restart takes its channel leases right back. Leases are per worker id, so
      # `--scale detector=2` would make two processes share one owner (both score every
      # channel): run more detectors as separate services, each with its own id.
      CLIPPER_WORKER_ID: detector-1
      CLIPPER_DETECTOR_MODE: live
      CLIPPER_DETECTOR_JUDGE_JOBS: "0"
      CLIPPER_TWITCH_CLIENT_ID: ${CLIPPER_TWITCH_CLIENT_ID:-}
      CLIPPER_TWITCH_CLIENT_SECRET: ${CLIPPER_TWITCH_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  # Judge (DESIGN §19): judge jobs -> clips, edit plans, render jobs; context rounds; revisions.
  # Profile `judge`: a bare `docker compose up -d` leaves it out; start it by name. Model `fake`
  # (deterministic rules) unless CLIPPER_JUDGE_MODEL=claude-cli in .env: the Claude Code CLI
  # pinned in the image, on the user's subscription, with the token of `claude setup-token`
  # (CLIPPER_JUDGE_CLAUDE_OAUTH_TOKEN in .env). It checks `claude auth status` at start and exits
  # unless that shows the token (authMethod oauth_token), and runs one call at a time. Never
  # give it an ANTHROPIC_API_KEY (the adapter builds the CLI's environment from scratch anyway).
  # Nothing enqueues judge jobs until the detector runs with CLIPPER_DETECTOR_JUDGE_JOBS=1; its
  # `render` jobs queue until the renderer exists (§20). The usage guard is off (no caps set).
  # Needs migration 0005.
  judge:
    profiles: [judge]
    build:
      context: .
      dockerfile: services/judge/Dockerfile
    image: clipper/judge:dev
    init: true   # tini as PID 1: reaps what a killed `claude` process tree leaves behind
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: judge
      CLIPPER_WORKER_ID: judge-1   # stable id: one heartbeat row across restarts
      CLIPPER_JUDGE_MODEL: ${CLIPPER_JUDGE_MODEL:-fake}
      CLIPPER_JUDGE_CLAUDE_OAUTH_TOKEN: ${CLIPPER_JUDGE_CLAUDE_OAUTH_TOKEN:-}
      CLIPPER_JUDGE_CLAUDE_MODEL: ${CLIPPER_JUDGE_CLAUDE_MODEL:-claude-opus-5-5}
      CLIPPER_JUDGE_CLAUDE_EFFORT: ${CLIPPER_JUDGE_CLAUDE_EFFORT:-}   # empty: the CLI's default
      CLIPPER_JUDGE_CLAUDE_CONFIG_DIR: /var/lib/clipper-judge
    volumes:
      - judge-claude:/var/lib/clipper-judge   # the CLI's own HOME/config (not the user's ~/.claude)
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 30s   # jobs in progress get 20 s to finish

  # Backfill tool (one-off, profile `tools`): past VODs in the live format (DESIGN §17).
  #   docker compose run --rm backfill vod 2932113307 --dry-run
  #   docker compose run --rm backfill vod 2932113307 --max-minutes 30
  #   docker compose run --rm backfill status
  # Twitch access is anonymous; Helix credentials (for `channel`) are optional.
  backfill:
    profiles: [tools]
    build:
      context: .
      dockerfile: tools/backfill/Dockerfile
    image: clipper/backfill:dev
    environment:
      <<: *app-env
      CLIPPER_SERVICE_NAME: backfill
      CLIPPER_TWITCH_CLIENT_ID: ${CLIPPER_TWITCH_CLIENT_ID:-}
      CLIPPER_TWITCH_CLIENT_SECRET: ${CLIPPER_TWITCH_CLIENT_SECRET:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"
    stop_grace_period: 30s   # SIGTERM finishes the chunk in progress

volumes:
  pgdata:
  objectdata:
  spool:
  models:
  judge-claude:
